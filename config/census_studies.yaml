    incubation_days: 3
    region: null
    primers: null
    platform: ILLUMINA
    match_field: sample_title
    env_pattern: '^Bovine rumen sample'
    plate_pattern: '^Agar plate media'
    decision: pending
    reason: >-
      Plates come from one selected cow, so only one source sample can be linked to plates;
      the other 36 rumen libraries are unmatched. Keep as a low-weight study, decide at GATE 1.

  - id: eevers2021_phylloplane
