    citation: De Keyser et al. 2020, Front Microbiol
    habitat: food (broiler carcass)
    host_associated: true
    media: ["plate count agar", "TSA", "blood agar"]
    temperature_c: [7, 30]
    oxygen: [aerobic]
    incubation_days: null       # 3 days at 30 C; 4-7 days at 7 C
    region: null
    primers: null
    platform: ILLUMINA
    match_field: library_name
    env_pattern: '_SH$'
    plate_pattern: '_(?:BA|TSA|PCA)\d+$'
    decision: include
    reason: >-
      Carcass homogenates (_SH) sequenced alongside plate washes of the same homogenate on
      three media at two temperatures.

  - id: fuentes2018_rumen
