  - id: lennon2019_claytill
    accession: PRJNA483533
    doi: 10.1128/aem.02658-18
    citation: Nielsen et al. 2019, Appl Environ Microbiol
    study_group: nielsen2019
    linkage: per_site
    tier: B
    tier_note: 5 soil/sediment compartments; plates link to compartment
    habitat: soil
    host_associated: false
    media: ["25% R2A (porous surface model plate lift)", "25% R2A (reference plate)"]
    temperature_c: [25]
    oxygen: [aerobic]
    incubation_days: 3
    incubation_note: >-
      Inoculated ceramic discs held 24 or 48 h at room temperature, then lifted onto 25% R2A
      (natamycin) and incubated 48-72 h at 25 C; reference plates drop-plated directly on 25% R2A.
    region: V3-V4
    primers: 341F/806R
    primer_fwd: CCTACGGGNGGCWGCAG
    primer_rev: GACTACHVGGGTATCTAATCC
    platform: ILLUMINA
    match_field: sample_title
    env_pattern: 'community extracted from soil|DNA extracted from soil'
    plate_pattern: 'grown on (?:hydrated surface|solid medium)'
    decision: include
    reason: >-
      Nycodenz-extracted soil communities and the DNA extracted from soil are the culture-
      independent side; agar-plate communities (full reference plates and porous-surface-model
      plates) are the plate side, from the same five soil/sediment compartments.

  - id: wang2023_desertsoil
    accession: PRJNA889009
    doi: 10.1038/s41522-023-00439-8
    citation: Wang et al. 2023, npj Biofilms Microbiomes
    study_group: wang2023
    linkage: per_site
    tier: B
    tier_note: only 2 source samples (bulk, rhizosphere) but 360 plate samples over 3 temperatures
    habitat: soil
    host_associated: false
    media: ["many (culturomics panel incl. R2A, TSA, HA)"]
    temperature_c: [15, 30, 45]
    oxygen: [aerobic]
    incubation_days: 15
    incubation_note: 3-15 days depending on medium (per-treatment table in the paper).
    region: full-length
    primers: 27F/1492R
    primer_fwd: AGRGTTTGATYNTGGCTCAG
    primer_rev: TASGGHTACCTTGTTASGACTT
    platform: PACBIO_SMRT
    match_field: sample_title
    env_pattern: '^OSS$'
    plate_pattern: '^[BR]C[LMH]$'
    decision: include
    reason: >-
      Methods state full-length 16S sequencing of "the two original soil samples and the 360
      culture-enriched samples"; culture samples are labelled bulk/rhizosphere at 15/30/45 C.
      Only two source samples, so it contributes conditions, not independent source samples.

  - id: dueholm2023_sludge
    accession: PRJNA981068
    doi: 10.1128/aem.01151-23
    citation: Dueholm et al. 2023, Appl Environ Microbiol
    study_group: dueholm2023
    linkage: single_source
    tier: C
    tier_note: one activated sludge source; many media and oxygen conditions
    habitat: activated sludge
    host_associated: false
    media: ["R2A agarose", "activated sludge filtrate (ASF) agarose + carbon/nitrogen sources"]
    temperature_c: [25]
    oxygen: [aerobic, anaerobic]
    incubation_days: 21
    incubation_note: 2-3 weeks at 25 C, oxic or anoxic; the medium of each plate comes from its sample metadata.
