    habitat: activated sludge
    host_associated: false
    media: ["activated sludge filtrate (ASF) agarose", "ASF + 12 antibiotics x 3 levels"]
    temperature_c: [25]
    oxygen: [aerobic]
    incubation_days: 14
    incubation_note: >-
      Plates sealed with parafilm at 25 C for 14 days. No anaerobic incubation is described, so
      aerobic is inferred from the methods, not stated.
    region: full-length
    primers: 27F/1391R
    primer_fwd: AGRGTTYGATYMTGGCTCAG
    primer_rev: GACGGGCGGTGWGTRCA
    platform: PACBIO_SMRT
    match_field: library_name
    env_pattern: '^RAW_\d+$'
    plate_pattern: '^(?:CTRL|AMP|CAR|CHL|CIP|ERI|GEN|KAN|NEO|RIF|STR|TET)_'
    decision: include
    reason: >-
      Full-length 16S of biomass scraped from each plate after 14 days plus the raw activated
      sludge source (RAW_*); isolate_* and PCR controls excluded by the pattern. Antibiotic
      plates are a selective medium class.

