  - id: higuera2024_seawater
    accession: PRJNA971915
    doi: 10.1186/s40659-024-00556-4
    citation: 2024, Biol Res
    study_group: higuera2024
    linkage: per_site
    tier: B
    tier_note: 2 sites; 2 media with and without 3 antibiotics
    habitat: marine water
    host_associated: false
    media: ["pool of 7 media (Instant Ocean agar, seawater agar, R2A x3 variants, LB 1/10, TSAYE)",
            "nutrient medium (LB 1/10)", "saline medium (R2A in seawater)",
            "+ antibiotics (OTC, FLQ, FFC)"]
    temperature_c: [22.5]       # stated as 20-25 C; midpoint
    oxygen: [aerobic]
    incubation_days: 7
    incubation_note: >-
      20-25 C for 7 days. The "Culturable community" pool combines scrapings of all 7 media from
      the seawater. The nutrient/saline (+/- antibiotic) plates were inoculated from that pool,
      NOT from seawater, so only the pool links directly to the environmental sample.
    region: V1-V3
    primers: 28F/519R
    primer_fwd: GAGTTTGATCMTGGCTCAG
    primer_rev: GWATTACCGCGGCKGCTG
    platform: ILLUMINA
    match_field: sample_title
    env_pattern: '^Bacterial community$'
    plate_pattern: '^Culturable bacteria pool$'   # D-020: re-plated subcultures excluded
    decision: include
    reason: >-
      Two sites (salmon farm and Pacific shore) with a direct community library and culturable
      pools on two media with and without antibiotics.

