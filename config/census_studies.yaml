  - id: fuentes2018_rumen
    accession: SRP153190
    doi: 10.3389/fmicb.2018.01999
    citation: Zehavi et al. 2018, Front Microbiol
    study_group: zehavi2018
    linkage: single_source
    tier: C
    tier_note: plates from one cow only (single source, like the two Dueholm studies)
    habitat: rumen
    host_associated: true
    media: ["M10 defined", "M10 + clarified rumen fluid"]
    temperature_c: [39]
    oxygen: [anaerobic]
    incubation_days: 3
    region: V4
    primers: 515F/806R
    primer_fwd: null            # printed sequences are 341F/907R, not 515F/806R; see reason
    primer_rev: null
    platform: ILLUMINA
    match_field: sample_title
    env_pattern: '^Bovine rumen sample'
    plate_pattern: '^Agar plate media'
    decision: include
    reason: >-
      Plates come from one selected cow, so only one source sample can be linked to plates;
      the other rumen libraries are unmatched and only that cow's library is used. Included as
      a single-source tier C study, like the two Dueholm studies. The paper names 515F/806R
      (V4) but prints the 341F and 907R sequences; the deposited reads are 252-253 bp, already
      primer-trimmed and merged, and start at the base after 515F, so the data are V4.

