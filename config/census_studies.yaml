# Phase 1 census: candidate studies that sequenced BOTH an environmental sample and the
# plate-grown community from it. Curated by reading each paper's methods and each study's ENA
# run table; counts are NOT written here, script 12 computes them from the cached ENA tables.
#
# env_pattern / plate_pattern: regular expressions applied to `match_field` of the ENA run
# table to label each run. Runs matching neither are "other" (isolates, controls, liquid
# enrichments) and are not used. Fields left null are not yet verified.
# decision: include | exclude | pending. Inclusion criteria: DECISIONS.md D-015.
#
# primer_fwd / primer_rev: primer sequences exactly as printed in the paper (or its
# supplement); the source URL for each is in notes/sources.md. incubation_days is the longest
# plate incubation; ranges and per-condition detail are in incubation_note.

studies:
  - id: zheng2024_soil
    accession: PRJNA1029248
    doi: 10.1038/s41467-024-53446-4
    citation: Zheng et al. 2024, Nat Commun
    study_group: zheng2024
    linkage: per_sample
    tier: A
    tier_note: 6 soils, each with its own plate conditions
    habitat: soil
    host_associated: false
    media: ["1% TSA", "soil extract"]
    temperature_c: [26]
    oxygen: [aerobic, anaerobic, microaerophilic]
    incubation_days: 28
    region: V4
    primers: 515F/806R
    primer_fwd: GTGCCAGCMGCCGCGGTAA
    primer_rev: GGACTACHVGGGTWTCTAAT
    platform: ILLUMINA
    match_field: library_name
    env_pattern: '^(?:TA|SM|HN|YN|NX|GD)_\d+_ORI_ORI$'
    plate_pattern: '^(?:TA|SM|HN|YN|NX|GD)_\d+_(?:AE|AN|MI)_(?:TSA|inSITU)$'
    decision: include
    reason: Phase 0 study; verified against the paper and Supplementary Data 1.

