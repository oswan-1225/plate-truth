# Pre-set analysis thresholds. Change values here, never inline in code.
# Any change after modelling starts must be logged with the reason.

# "Grew" (primary): enriched on plates relative to the matching environmental sample.
grew:
  min_fold_enrichment: 2.0   # plate relative abundance / environment relative abundance
  min_reads: 5               # reads in the plating condition

# "Detected" (looser, always reported alongside "grew").
detected:
  min_reads: 2

# Nearest-relative identity.
identity:
  # VSEARCH --iddef value. The project definition specifies 1 (gaps counted). Verify against the
  # current VSEARCH manual in Phase 0 and record the source URL.
  iddef: 1
  alt_iddef: null            # set in Phase 0 after reading the manual, for the sensitivity run
  # Bin edges in percent identity. Bins: none, <90, [90,94.5), [94.5,97), [97,99), >=99
  bin_edges_percent: [90.0, 94.5, 97.0, 99.0]
  database_proxy_percent: 94.5   # "has a cultured relative" shortcut being tested

# Phase 0 sensitivity grid.
sensitivity:
  min_reads: [2, 5, 10]
  min_fold_enrichment: [1.5, 2.0, 5.0]

# Bootstrap / resampling.
resampling:
  n_bootstrap: 1000
  seed: 20261019

# Read processing (reads -> ASVs), shared by every study unless overridden in studies.yaml.
amplicon:
  primer_error_rate: 0.1      # cutadapt -e: up to 1 mismatch per 10 primer bases
  max_ee: 1.0                 # VSEARCH --fastq_maxee after merging
  min_len: 200                # merged amplicon minimum length (V4 ~253 bp)
  unoise_minsize: 8           # minimum pooled abundance of a unique sequence to become an ASV
  unoise_alpha: 2.0
  map_id: 0.97                # reads are counted to their nearest ASV within 3% differences

# Cultured 16S reference.
reference:
  full_min_len: 1000          # BacDive strain 16S: minimum length of the full sequence
  full_max_ambig: 0.01        # BacDive strain 16S: maximum fraction of ambiguous bases
  pcr_error_rate: 0.15        # in-silico PCR primer mismatch tolerance (about 3 per primer)
  region_min_len: 220         # extracted amplified region length window (V4 ~253 bp)
  region_max_len: 300
  # Phase 2: length window per amplified region (primers removed), [min, max] bp. Set wide
  # around the expected lengths (V3-V4 ~425, V1-V3 ~450-470) so length-variable taxa are not
  # lost; script 15 reports the observed length percentiles per reference to check this.
  region_length:
    V4: [220, 300]
    V3-V4: [360, 480]
    V1-V3: [380, 560]
  # Full-length (PacBio) studies are cut in silico to this study's primer pair (D-017, D-023).
  full_length_cut_to: zheng2024_soil

# An ASV is 'present' in a source sample if it has at least this many reads summed over the
# sample's environmental PCR replicates (same rule as the pilot).
environment:
  min_reads: 2

# Minimum depth (D-027): a plating condition is usable only if its pooled plate reads AND its
# source sample's pooled environmental reads (prokaryotic ASVs only) both reach min_pool_reads.
depth:
  min_pool_reads: 1000
  sensitivity: [5000, 10000]
