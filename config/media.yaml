# Plate media: one entry per (study, medium label as recorded in the sample sheet).
# medium_name is the harmonized name; the classes are defined below.
# Each entry holds recipe FACTS (antibacterial, habitat_material, complex_source,
# organic_g_per_l, composition_source); the class is computed from them by
# plate_truth.media.classify_medium (D-025). medium_class_override (with override_reason)
# is used only where no recipe rule applies (pooled media, unknown medium). Entries with
# neither are pending a recipe source.
classes:
  rich_complex: Full-strength complex medium (peptones, extracts) such as TSA, LB, nutrient agar, BHI,
    blood agar.
  dilute_oligotrophic: 'Low-nutrient complex medium: R2A, or a complex medium diluted 1/10 or more.'
  defined_minimal: Chemically defined medium with a single or few carbon sources and no complex extract.
  environment_extract: 'Medium made from the habitat itself: soil extract, filtered wastewater, sludge
    filtrate, seawater, plant extract.'
  selective: Any of the above with an added antibiotic or other agent selecting against bacterial groups.
  other: Media that fit none of the above.
  unresolved: The paper does not say which medium the plate used (e.g. numbered plates without a published
    key).
