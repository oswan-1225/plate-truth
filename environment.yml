name: plate-truth
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # --- data and statistics ---
  - numpy
  - pandas
  - scipy
  - psutil
  - statsmodels
  - scikit-learn
  - lightgbm
  - pyarrow
  - openpyxl
  # --- figures ---
  - matplotlib
  - seaborn
  # --- sequences and data access ---
  - biopython
  - requests
  - pyyaml
  - python-dotenv
  - tqdm
  # --- app and manuscript ---
  - streamlit
  - pandoc
  # --- dev ---
  - pytest
  - pytest-cov
  - ruff
  - ipykernel
  # --- R (mixed models only) ---
  - r-base=4.4
  - r-lme4
  - r-glmmtmb
  # Pin OpenBLAS: the default MKL build crashed natively on matrix multiply on the
  # Windows development machine (seen in the soil pilot).
  - libblas=*=*openblas
  - pip
  - pip:
      - cutadapt==5.2   # primer trimming and in-silico PCR; installed by pip on every OS
# Not in this file on purpose:
#   * VSEARCH has no win-64 conda package. scripts/00_get_vsearch.py downloads the
#     official Windows release binary into tools/ (Linux/macOS users install it from
#     bioconda instead: bioconda::vsearch).
#   * Reads are denoised with VSEARCH UNOISE3 (not DADA2), so no R/Bioconductor step is
#     needed for read processing.
